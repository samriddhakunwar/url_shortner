{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}URL Shortener{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'frontend/css/style.css' %}">
</head>
<body>
  <nav class="navbar">
    <a href="/" class="nav-brand">URL Shortener</a>
    <div class="nav-links">
      <a href="/" {% if request.path == "/" %}class="active"{% endif %}>Dashboard</a>
      <a href="/create/" {% if request.path == "/create/" %}class="active"{% endif %}>Create</a>
      <a href="/urls/" {% if "/urls/" in request.path %}class="active"{% endif %}>My URLs</a>
      <a href="/analytics/" {% if request.path == "/analytics/" %}class="active"{% endif %}>Analytics</a>
    </div>
    <div class="nav-right">
      <span class="nav-user">{{ request.user.username }}</span>
      <a href="/logout/" class="nav-logout">Log out</a>
    </div>
  </nav>

  <div class="container">
    {% if messages %}
    <div class="messages">
      {% for msg in messages %}
      <div class="msg msg-{{ msg.tags }}">{{ msg }}</div>
      {% endfor %}
    </div>
    {% endif %}

    {% block content %}{% endblock %}
  </div>

  <script src="{% static 'frontend/js/app.js' %}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
